<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waiwai · 365の事件 演出プレビュー</title><style>
body{margin:0;background:#eee9dc;color:#4c594a;font-family:system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:24px}header{margin-bottom:22px}small{letter-spacing:.16em;color:#8b7c65}h1{font-size:25px;margin:8px 0}p{font-size:13px;line-height:1.9}nav, .controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,select{font:inherit;font-size:12px;padding:9px 12px;background:#fff8e9;border:1px solid #c8b99c;border-radius:6px;color:#61543f}select{max-width:100%}section{border:1px solid #c8b99c;padding:16px;border-radius:12px;background:#f7f3e7}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:20px}#stage{position:relative;background:#a7b895}#stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated}#illustration{width:100%;image-rendering:pixelated}#notice{min-height:70px}#sky-window[hidden]{display:none}a{color:#627d62}#game canvas{width:100%!important;height:auto!important}@media(max-width:760px){.layout{grid-template-columns:1fr}}
</style></head><body><main><header><small>WAIWAI · EVENT ART LAB</small><h1>毎日、どこかで。365の小さな事件。</h1><p>開発用の演出プレビュー。ここで選んでも、実際の館内で起こる事件は変更されません。館内では毎日JST 0時に1件だけ発生します。</p><a href="/">オフィスに戻る ↗</a></header><nav id="examples" aria-label="代表的な事件"></nav><div class="controls"><label>エピソード <select id="episodes"></select></label><label>部屋 <select id="rooms"></select></label><label><input type="checkbox" id="reduce">動きを抑える</label></div><div class="layout"><section><div id="stage"><canvas id="sky-window" width="480" height="56" role="img" aria-label="事件が起きた窓の外"></canvas><div id="game"></div></div><p>✦ マップの来客や小物をクリックして調べられます。</p><p id="notice" role="status"></p></section><section><small id="theme"></small><h2 id="title"></h2><canvas id="illustration" width="256" height="144" role="img" aria-label="選択した事件のピクセルイラスト"></canvas><p id="story"></p><p>26テーマ・365本のエピソード。テーマごとのピクセルアートに、洪水の水面や窓の外の来客を組み合わせています。</p></section></div></main><script type="module" src="./events-preview.ts"></script></body></html>
