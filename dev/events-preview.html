<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waiwai · 365の事件 演出プレビュー</title><style>
body{margin:0;background:#eee9dc;color:#4c594a;font-family:system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:24px}header{margin-bottom:22px}small{letter-spacing:.16em;color:#8b7c65}h1{font-size:25px;margin:8px 0}p{font-size:13px;line-height:1.9}nav, .controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,select,input[type=search]{font:inherit;font-size:12px;padding:9px 12px;background:#fff8e9;border:1px solid #c8b99c;border-radius:6px;color:#61543f}select{max-width:100%}section{border:1px solid #c8b99c;padding:16px;border-radius:12px;background:#f7f3e7}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:20px}#stage{position:relative;background:#a7b895}#stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated}#illustration{width:100%;image-rendering:pixelated}#notice{min-height:70px}#sky-window[hidden]{display:none}a{color:#627d62}#game canvas{width:100%!important;height:auto!important}@media(max-width:760px){.layout{grid-template-columns:1fr}}
#event-gallery{margin-top:28px;padding:18px;border:1px solid #c8b99c;border-radius:12px;background:#f7f3e7}button:disabled{opacity:.4}.gallery-card small{font-size:11px;letter-spacing:0;line-height:1.7;color:#706955}summary{cursor:pointer;font-weight:700}#gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.gallery-card{padding:8px;text-align:left;display:flex;flex-direction:column;gap:7px;background:#fffaf0}.gallery-card canvas{width:100%;height:auto;image-rendering:pixelated;background:#e5deca}.gallery-card span{font-size:11px;line-height:1.6}.gallery-card[aria-pressed=true]{outline:2px solid #738f65}.controls{align-items:center}#episode-progress{font-size:12px;min-width:72px}@media(max-width:700px){#gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}#story{white-space:pre-line}</style></head><body><main><header><small>WAIWAI · EVENT ART LAB</small><h1>365日の事件を、ひとつずつ。</h1><p>開発用の演出プレビュー。ここで選んでも、実際の館内で起こる事件は変更されません。館内では毎日JST 0時に1件だけ発生します。</p><a href="/">オフィスに戻る ↗</a></header><nav id="examples" aria-label="代表的な事件"></nav><div class="controls"><button type="button" id="previous">← 前の事件</button><button type="button" id="next">次の事件 →</button><strong id="episode-progress" aria-live="polite"></strong><label>分野 <select id="themes"><option value="">すべての分野</option></select></label><label>事件を検索 <input id="search" type="search" placeholder="例：椅子、恐竜、魔法"></label><a href="#event-gallery">365件の一覧へ ↓</a><label>事件 <select id="episodes"></select></label><label>部屋 <select id="rooms"></select></label><label>照明 <select id="light"><option value="12">昼</option><option value="7">朝</option><option value="17">夕方</option><option value="22">夜</option><option value="now">現在のJST</option></select></label><label><input type="checkbox" id="reduce">動きを抑える</label></div><div class="layout"><section><div id="stage"><canvas id="sky-window" width="480" height="56" role="img" aria-label="事件が起きた窓の外"></canvas><div id="game"></div></div><p>✦ マップの来客や小物をクリックして調べられます。</p><p id="notice" role="status"></p></section><section><small id="theme"></small><h2 id="title"></h2><canvas id="illustration" width="256" height="144" role="img" aria-label="選択した事件のピクセルイラスト"></canvas><p id="story"></p><p>365種類の出来事。構造に穴が開く事件は2件、水浸しは2件、サンタの登場は1件。人物は普段の大きさです。</p></section></div><details id="event-gallery" open><summary>365件の演出一覧</summary><p>サムネイルを押すと、その事件を上の部屋で確認できます。分野の絞り込みと部屋の選択も一覧に反映します。</p><p id="gallery-count" role="status"></p><div id="gallery-grid"></div></details></main><script type="module" src="./events-preview.ts"></script></body></html>
