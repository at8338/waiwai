</style></head><body><main><header><small>WAIWAI · LITTLE LOST &amp; FOUND</small><h1>それ、なんでここに？</h1><p>375種類の、小さな落とし物たち。<br>元からいた10個と、新入り365個。見つけたら、ちょっとだけ寄り道を。</p><p class="rules">全館で最大3種類・各1個。30分ごとに、どこかの部屋へ。</p></header><div class="filters"><label for="search">さがす</label><input id="search" type="search" placeholder="例：ロボット、会議、休憩"><label for="scope">仲間</label><select id="scope"><option value="all">すべて</option><option value="new">新入り365種類</option><option value="old">いつもの10種類</option></select><span id="count" role="status"></span></div><div id="gallery" class="gallery"></div><p class="note">開発用の全種類プレビューです。実際のマップに並ぶのは、全館合計で最大3個だけです。</p></main><script type="module" src="./lost-items-preview.ts"></script></body></html>
