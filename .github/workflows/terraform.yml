name: Terraform dev validation
on:
  pull_request:
    paths: ['infra/**', 'scripts/azure/**', 'docs/infrastructure/**', 'docs/azure.md', 'package.json', '.github/workflows/terraform.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Install locked dependencies for deployment policy tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format, validate and mock tests (no Azure credentials or apply)
        run: npm run infra:check
